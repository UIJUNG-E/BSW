<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>창고 메자닌 선반 실시간 재고 관리</title>
    <!-- Firebase Realtime Database SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
            color: #333;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .sync-status {
            text-align: center;
            font-size: 13px;
            color: #28a745;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .all-racks-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 100%;
            overflow-x: auto;
        }
        .rack-section {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .rack-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #0056b3;
            border-left: 4px solid #007bff;
            padding-left: 8px;
        }
        .rack-section.aisle-section {
            background: #f1f9f5;
            border: 1px dashed #28a745;
        }
        .rack-title.aisle-title {
            color: #1e7e34;
            border-left-color: #28a745;
        }

        .shelf-tier {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f1f1f1;
            padding-bottom: 8px;
            margin-top: 6px;
        }
        .tier-label {
            width: 60px;
            font-weight: bold;
            text-align: center;
            background: #e9ecef;
            padding: 8px;
            border-radius: 4px;
            margin-right: 15px;
            font-size: 13px;
        }
        .grid-14 {
            display: grid;
            grid-template-columns: repeat(14, 55px);
            gap: 6px;
        }
        .slot {
            width: 55px;
            height: 55px;
            border: 2px solid #ccc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            background-color: #f8f9fa;
        }

        .slot.aisle {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .slot.empty {
            background-color: #fff3cd;
            border-color: #ffeeba;
            color: #856404;
        }
        .slot.occupied {
            background-color: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        .slot.defect {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .slot.drag-over {
            border: 2px dashed #007bff;
            background-color: #e2e3e5;
        }

        .legend-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-box {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        /* 모달 팝업 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 380px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin-top: 0; }
        .modal-content p { margin: 12px 0; }
        
        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .input-row input {
            height: 26px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0 8px;
            flex: 1;
        }
        .item-list-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }
        .btn-delete:hover {
            background-color: #a73a45;
        }
        .btn-add-item {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-add-item:hover {
            background-color: #218838;
        }

        .modal-buttons {
            text-align: right;
            margin-top: 22px;
        }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; margin-right: 5px; }

        .instructions {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>창고 전체 메자닌 선반 실시간 재고 관리</h2>
    <div class="sync-status" id="syncStatus">🔄 서버 연결 중...</div>

    <div class="legend-container">
        <div class="legend-item"><div class="legend-box" style="background:#d1ecf1; border-color:#bee5eb;"></div> 재고 있음</div>
        <div class="legend-item"><div class="legend-box" style="background:#fff3cd; border-color:#ffeeba;"></div> 재고 없음 (노란색)</div>
        <div class="legend-item"><div class="legend-box" style="background:#d4edda; border-color:#c3e6cb;"></div> 통로/복도 (녹색)</div>
        <div class="legend-item"><div class="legend-box" style="background:#f8d7da; border-color:#f5c6cb;"></div> 불량</div>
    </div>
    
    <div class="all-racks-container" id="allRacks"></div>

    <div class="instructions">
        💡 모든 사용자의 화면이 실시간으로 동기화됩니다. 드래그 앤 드롭 및 상세 수정을 해보세요!
    </div>

    <!-- 상세 정보 팝업 모달 -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h3 id="modalTitle">로케이션 정보</h3>
            <p><strong>위치:</strong> <span id="modalLoc"></span></p>
            
            <p>
                <strong>파레트 번호:</strong>
                <div class="input-row">
                    <input type="text" id="modalPallet" oninput="handlePalletInput(this.value)">
                    <button type="button" class="btn-delete" onclick="clearPalletField()">삭제</button>
                </div>
            </p>
            
            <p>
                <strong>제품명 목록:</strong>
                <div class="item-list-container" id="itemListContainer">
                    <!-- 동적 제품명 입력 필드들 -->
                </div>
            </p>

            <p>
                <strong>상태:</strong><br>
                <select id="modalStatus" style="height: 30px; border-radius: 4px; border: 1px solid #ccc; width: 100%; margin-top: 4px;">
                    <option value="occupied">재고 있음</option>
                    <option value="empty">재고 없음 (x)</option>
                    <option value="aisle">통로/복도</option>
                    <option value="defect">불량</option>
                </select>
            </p>

            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn btn-primary" onclick="saveModalData()">저장</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase 설정 (제공해주신 Realtime Database 주소 연동)
        const firebaseConfig = {
            databaseURL: "https://warehouse-bs-5e863-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('warehouse');

        let warehouseData = {};
        let currentEditingKey = null;
        let draggedSourceKey = null;

        const totalRacks = 6;
        const aisleRacks = [2, 5]; // 2구역, 5구역은 통로

        // 최초 기본 데이터 생성 (DB가 비어있을 경우에만 초기화)
        function initDefaultData() {
            dbRef.once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    let initialData = {};
                    for (let r = 1; r <= totalRacks; r++) {
                        let isAisle = aisleRacks.includes(r);
                        for (let tier = 3; tier >= 1; tier--) {
                            for (let col = 1; col <= 14; col++) {
                                let key = `R${r}-${tier}-${col}`;
                                let val = '';
                                let status = 'occupied';

                                if (isAisle) {
                                    val = '';
                                    status = 'aisle';
                                } else {
                                    val = (col % 3 === 0) ? 'x' : (r * 10 + col);
                                    if (col === 5 && r === 3) val = '불량';

                                    if (val === 'x' || val === '') {
                                        status = 'empty';
                                        val = 'x';
                                    } else if (val === '불량') {
                                        status = 'defect';
                                    } else {
                                        status = 'occupied';
                                    }
                                }

                                initialData[key] = {
                                    rack: r,
                                    tier: tier,
                                    col: col,
                                    pallet: val,
                                    items: [val && val !== 'x' ? `제품-${val}` : '-'],
                                    status: status
                                };
                            }
                        }
                    }
                    dbRef.set(initialData);
                }
            });
        }

        // Firebase 실시간 리스너 연결 (데이터 변경 시 자동 렌더링)
        function listenRealtimeData() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    warehouseData = data;
                    renderWarehouse();
                    document.getElementById('syncStatus').innerText = "🟢 실시간 동기화 연결됨";
                }
            }, (error) => {
                document.getElementById('syncStatus').innerText = "🔴 연결 오류: " + error.message;
                document.getElementById('syncStatus'].style.color = "red";
            });
        }

        function renderWarehouse() {
            const container = document.getElementById('allRacks');
            container.innerHTML = '';

            for (let r = 1; r <= totalRacks; r++) {
                let isAisle = aisleRacks.includes(r);

                const rackDiv = document.createElement('div');
                rackDiv.className = `rack-section ${isAisle ? 'aisle-section' : ''}`;
                
                const titleDiv = document.createElement('div');
                titleDiv.className = `rack-title ${isAisle ? 'aisle-title' : ''}`;
                titleDiv.innerText = isAisle ? `🚶‍♂️ [ 통 로 (복도 ${r}) ]` : `📦 [ 제 ${r} 구역 메자닌 선반 ]`;
                rackDiv.appendChild(titleDiv);

                for (let tier = 3; tier >= 1; tier--) {
                    const tierDiv = document.createElement('div');
                    tierDiv.className = 'shelf-tier';

                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'tier-label';
                    labelDiv.innerText = `${tier}층`;
                    tierDiv.appendChild(labelDiv);

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'grid-14';

                    for (let col = 1; col <= 14; col++) {
                        let key = `R${r}-${tier}-${col}`;
                        let data = warehouseData[key];
                        if (!data) continue;

                        const slot = document.createElement('div');
                        slot.className = `slot ${data.status}`;
                        slot.innerText = data.pallet;
                        
                        const hasValue = data.pallet !== '' && data.pallet !== 'x';
                        slot.setAttribute('draggable', hasValue);
                        slot.dataset.key = key;

                        slot.addEventListener('dragstart', handleDragStart);
                        slot.addEventListener('dragover', handleDragOver);
                        slot.addEventListener('dragleave', handleDragLeave);
                        slot.addEventListener('drop', handleDrop);
                        slot.addEventListener('click', () => openModal(key));

                        gridDiv.appendChild(slot);
                    }
                    tierDiv.appendChild(gridDiv);
                    rackDiv.appendChild(tierDiv);
                }
                container.appendChild(rackDiv);
            }
        }

        function handleDragStart(e) {
            draggedSourceKey = e.target.dataset.key;
            e.dataTransfer.setData('text/plain', draggedSourceKey);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        // 드래그 앤 드롭 완료 시 Firebase에 즉시 반영
        function handleDrop(e) {
            e.preventDefault();
            const targetKey = e.currentTarget.dataset.key;
            e.currentTarget.classList.remove('drag-over');

            if (draggedSourceKey && draggedSourceKey !== targetKey) {
                let srcData = warehouseData[draggedSourceKey];
                let targetData = warehouseData[targetKey];

                let srcIsAisle = aisleRacks.includes(srcData.rack);
                let targetIsAisle = aisleRacks.includes(targetData.rack);

                let updates = {};
                updates[targetKey + '/pallet'] = srcData.pallet;
                updates[targetKey + '/items'] = srcData.items;
                updates[targetKey + '/status'] = targetIsAisle ? 'occupied' : srcData.status;

                updates[draggedSourceKey + '/pallet'] = srcIsAisle ? '' : 'x';
                updates[draggedSourceKey + '/items'] = ['-'];
                updates[draggedSourceKey + '/status'] = srcIsAisle ? 'aisle' : 'empty';

                dbRef.update(updates);
            }
        }

        function openModal(key) {
            currentEditingKey = key;
            let data = warehouseData[key];

            let locationName = aisleRacks.includes(data.rack) 
                ? `통로 ${data.rack} / ${data.tier}층 / ${data.col}열`
                : `제 ${data.rack}구역 / ${data.tier}층 / ${data.col}열`;

            document.getElementById('modalTitle').innerText = locationName;
            document.getElementById('modalLoc').innerText = locationName;
            document.getElementById('modalPallet').value = data.pallet;
            document.getElementById('modalStatus').value = data.status;

            renderItemList(data.items || ['-']);
            document.getElementById('infoModal').style.display = 'flex';
        }

        function renderItemList(items) {
            const container = document.getElementById('itemListContainer');
            container.innerHTML = '';
            
            items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'input-row';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.value = item;
                input.className = 'item-input';
                row.appendChild(input);

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'btn-delete';
                delBtn.innerText = '삭제';
                delBtn.onclick = () => removeItemRow(index);
                row.appendChild(delBtn);

                if (index === 0) {
                    const addBtn = document.createElement('button');
                    addBtn.type = 'button';
                    addBtn.className = 'btn-add-item';
                    addBtn.innerText = '+';
                    addBtn.onclick = addItemRow;
                    row.appendChild(addBtn);
                }

                container.appendChild(row);
            });
        }

        function addItemRow() {
            const inputs = document.querySelectorAll('.item-input');
            let currentItems = Array.from(inputs).map(input => input.value);
            currentItems.push('');
            renderItemList(currentItems);
        }

        function removeItemRow(index) {
            const inputs = document.querySelectorAll('.item-input');
            let currentItems = Array.from(inputs).map(input => input.value);
            currentItems.splice(index, 1);
            if (currentItems.length === 0) currentItems.push('-');
            renderItemList(currentItems);
        }

        function clearPalletField() {
            document.getElementById('modalPallet').value = 'x';
            document.getElementById('modalStatus').value = 'empty';
            renderItemList(['-']);
        }

        function handlePalletInput(val) {
            if (val === 'x' || val === '') {
                document.getElementById('modalStatus').value = 'empty';
            } else if (val.length > 0) {
                document.getElementById('modalStatus').value = 'occupied';
            }
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            currentEditingKey = null;
        }

        // 저장 시 Firebase 데이터베이스에 반영 ➔ 모든 접속자 화면 실시간 동기화
        function saveModalData() {
            if (currentEditingKey) {
                const palletVal = document.getElementById('modalPallet').value;
                const statusVal = document.getElementById('modalStatus').value;
                const inputElements = document.querySelectorAll('.item-input');
                let itemsVal = Array.from(inputElements).map(input => input.value.trim()).filter(v => v !== '');
                if (itemsVal.length === 0) itemsVal = ['-'];

                dbRef.child(currentEditingKey).update({
                    pallet: palletVal,
                    items: itemsVal,
                    status: statusVal
                }, (error) => {
                    if (error) {
                        alert('저장 실패: ' + error.message);
                    } else {
                        closeModal();
                    }
                });
            }
        }

        // 실행
        initDefaultData();
        listenRealtimeData();
    </script>
</body>
</html>
