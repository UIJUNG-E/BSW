<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창고 메자닌 선반 재고 관리 System</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }
        .all-racks-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 100%;
            overflow-x: auto;
        }
        .rack-section {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
        }
        /* 일반 구역 제목 */
        .rack-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #0056b3;
            border-left: 4px solid #007bff;
            padding-left: 8px;
        }
        /* 통로 구역 제목 */
        .rack-section.aisle-section {
            background: #f1f9f5;
            border: 1px dashed #28a745;
        }
        .rack-title.aisle-title {
            color: #1e7e34;
            border-left-color: #28a745;
        }

        .shelf-tier {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f1f1f1;
            padding-bottom: 8px;
            margin-top: 6px;
        }
        .tier-label {
            width: 60px;
            font-weight: bold;
            text-align: center;
            background: #e9ecef;
            padding: 8px;
            border-radius: 4px;
            margin-right: 15px;
            font-size: 13px;
        }
        .grid-14 {
            display: grid;
            grid-template-columns: repeat(14, 55px);
            gap: 6px;
        }
        .slot {
            width: 55px;
            height: 55px;
            border: 2px solid #ccc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            background-color: #f8f9fa;
            text-align: center;
            word-break: break-all;
            padding: 2px;
            overflow: hidden;
        }

        /* --- 상태별 색상 설정 --- */
        .slot.aisle {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .slot.empty {
            background-color: #fff3cd;
            border-color: #ffeeba;
            color: #856404;
        }
        .slot.occupied {
            background-color: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        .slot.defect {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .slot.drag-over {
            border: 2px dashed #007bff;
            background-color: #e2e3e5;
        }

        /* 범례 표시 */
        .legend-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-box {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        /* 모달 팝업 스타일 */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 10px;
            width: 420px;
            max-width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
        .modal-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            color: #111;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
            color: #444;
        }
        
        /* 입력창 그룹 컨테이너 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            width: 100%;
        }
        .input-row input {
            flex: 1;
            height: 34px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0 10px;
            font-size: 13px;
            outline: none;
        }
        .input-row input:focus {
            border-color: #007bff;
        }

        /* 삭제 버튼 스타일 (빨간색 -> 마우스 오버 시 채도/밝기 낮아짐) */
        .btn-delete {
            height: 34px;
            background-color: #dc3545;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }
        .btn-delete:hover {
            background-color: #a73a45; /* 채도가 낮아진 빨간색 */
        }

        /* 제품명 동적 추가 (+) 버튼 스타일 */
        .btn-add {
            height: 34px;
            background-color: #28a745;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }
        .btn-add:hover {
            background-color: #1e7e34;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 22px;
        }
        .btn {
            height: 36px;
            padding: 0 16px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }

        .instructions {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>창고 전체 메자닌 선반 재고 관리</h2>

    <!-- 상단 범례 -->
    <div class="legend-container">
        <div class="legend-item"><div class="legend-box" style="background:#d1ecf1; border-color:#bee5eb;"></div> 재고 있음</div>
        <div class="legend-item"><div class="legend-box" style="background:#fff3cd; border-color:#ffeeba;"></div> 재고 없음 (노란색)</div>
        <div class="legend-item"><div class="legend-box" style="background:#d4edda; border-color:#c3e6cb;"></div> 통로/복도 (녹색)</div>
        <div class="legend-item"><div class="legend-box" style="background:#f8d7da; border-color:#f5c6cb;"></div> 불량</div>
    </div>
    
    <div class="all-racks-container" id="allRacks">
        <!-- 동적 생성 영역 -->
    </div>

    <div class="instructions">
        💡 일반 선반 및 통로 구역의 파레트를 자유롭게 드래그하여 이동할 수 있으며, 클릭 시 상세 정보 모달이 열립니다.
    </div>

    <!-- 상세 정보 팝업 모달 -->
    <div class="modal-backdrop" id="infoModal">
        <div class="modal-card">
            <h3 id="modalTitle">로케이션 상세 정보</h3>
            
            <div class="form-group">
                <label>위치:</label>
                <div id="modalLoc" style="font-size: 14px; font-weight: bold; color: #0056b3;"></div>
            </div>
            
            <!-- 파레트 번호 입력창 + 삭제 버튼 -->
            <div class="form-group">
                <label for="modalPallet">파레트 번호:</label>
                <div class="input-row">
                    <input type="text" id="modalPallet" placeholder="파레트 번호 입력">
                    <button type="button" class="btn-delete" onclick="handlePalletDelete()">삭제</button>
                </div>
            </div>
            
            <!-- 제품명 입력 영역 (+ 버튼으로 동적 추가 가능) -->
            <div class="form-group">
                <label>제품명 목록:</label>
                <div id="itemInputsContainer">
                    <!-- JS로 동적 생성됨 -->
                </div>
            </div>

            <!-- 상태 선택 -->
            <div class="form-group">
                <label for="modalStatus">상태:</label>
                <select id="modalStatus" style="width: 100%; height: 34px; border-radius: 4px; border: 1px solid #ccc; padding: 0 8px; font-size: 14px;">
                    <option value="occupied">재고 있음</option>
                    <option value="empty">재고 없음 (x)</option>
                    <option value="aisle">통로/복도</option>
                    <option value="defect">불량</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn btn-primary" onclick="saveModalData()">저장</button>
            </div>
        </div>
    </div>

    <script>
        let warehouseData = {};
        let currentEditingKey = null;
        let draggedSourceKey = null;

        const totalRacks = 6;
        const aisleRacks = [2, 5]; // 2구역, 5구역은 통로(복도)

        function initData() {
            for (let r = 1; r <= totalRacks; r++) {
                let isAisle = aisleRacks.includes(r);

                for (let tier = 3; tier >= 1; tier--) {
                    for (let col = 1; col <= 14; col++) {
                        let key = `R${r}-${tier}-${col}`;
                        
                        let val = '';
                        let status = 'occupied';

                        if (isAisle) {
                            val = '';
                            status = 'aisle';
                        } else {
                            val = (col % 3 === 0) ? 'x' : `${r * 10 + col}`;
                            if (col === 5 && r === 3) val = '불량';

                            if (val === 'x' || val === '') {
                                status = 'empty';
                                val = 'x';
                            } else if (val === '불량') {
                                status = 'defect';
                            } else {
                                status = 'occupied';
                            }
                        }

                        warehouseData[key] = {
                            rack: r,
                            tier: tier,
                            col: col,
                            pallet: val,
                            items: (val && val !== 'x' && val !== '불량') ? [`제품-${val}`] : [],
                            status: status
                        };
                    }
                }
            }
        }

        function renderWarehouse() {
            const container = document.getElementById('allRacks');
            container.innerHTML = '';

            for (let r = 1; r <= totalRacks; r++) {
                let isAisle = aisleRacks.includes(r);

                const rackDiv = document.createElement('div');
                rackDiv.className = `rack-section ${isAisle ? 'aisle-section' : ''}`;
                
                const titleDiv = document.createElement('div');
                titleDiv.className = `rack-title ${isAisle ? 'aisle-title' : ''}`;
                titleDiv.innerText = isAisle ? `🚶‍♂️ [ 통 로 (복도 ${r}) ]` : `📦 [ 제 ${r} 구역 메자닌 선반 ]`;
                rackDiv.appendChild(titleDiv);

                for (let tier = 3; tier >= 1; tier--) {
                    const tierDiv = document.createElement('div');
                    tierDiv.className = 'shelf-tier';

                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'tier-label';
                    labelDiv.innerText = `${tier}층`;
                    tierDiv.appendChild(labelDiv);

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'grid-14';

                    for (let col = 1; col <= 14; col++) {
                        let key = `R${r}-${tier}-${col}`;
                        let data = warehouseData[key];

                        const slot = document.createElement('div');
                        slot.className = `slot ${data.status}`;
                        slot.innerText = data.pallet;
                        
                        const hasValue = data.pallet !== '' && data.pallet !== 'x';
                        slot.setAttribute('draggable', hasValue);
                        slot.dataset.key = key;

                        slot.addEventListener('dragstart', handleDragStart);
                        slot.addEventListener('dragover', handleDragOver);
                        slot.addEventListener('dragleave', handleDragLeave);
                        slot.addEventListener('drop', handleDrop);
                        slot.addEventListener('click', () => openModal(key));

                        gridDiv.appendChild(slot);
                    }
                    tierDiv.appendChild(gridDiv);
                    rackDiv.appendChild(tierDiv);
                }
                container.appendChild(rackDiv);
            }
        }

        function handleDragStart(e) {
            draggedSourceKey = e.target.dataset.key;
            e.dataTransfer.setData('text/plain', draggedSourceKey);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetKey = e.currentTarget.dataset.key;
            e.currentTarget.classList.remove('drag-over');

            if (draggedSourceKey && draggedSourceKey !== targetKey) {
                let srcData = warehouseData[draggedSourceKey];
                let targetData = warehouseData[targetKey];

                let srcIsAisle = aisleRacks.includes(srcData.rack);
                let targetIsAisle = aisleRacks.includes(targetData.rack);

                warehouseData[targetKey].pallet = srcData.pallet;
                warehouseData[targetKey].items = [...srcData.items];
                warehouseData[targetKey].status = targetIsAisle ? 'occupied' : srcData.status;

                warehouseData[draggedSourceKey].pallet = srcIsAisle ? '' : 'x';
                warehouseData[draggedSourceKey].items = [];
                warehouseData[draggedSourceKey].status = srcIsAisle ? 'aisle' : 'empty';

                renderWarehouse();
            }
        }

        function openModal(key) {
            currentEditingKey = key;
            let data = warehouseData[key];

            let locationName = aisleRacks.includes(data.rack) 
                ? `통로 ${data.rack} / ${data.tier}층 / ${data.col}열`
                : `제 ${data.rack}구역 / ${data.tier}층 / ${data.col}열`;

            document.getElementById('modalTitle').innerText = '상세 정보 수정';
            document.getElementById('modalLoc').innerText = locationName;
            document.getElementById('modalPallet').value = data.pallet;
            document.getElementById('modalStatus').value = data.status;

            // 제품명 입력목록 렌더링
            renderItemInputs(data.items);

            document.getElementById('infoModal').style.display = 'flex';
        }

        /* 제품명 동적 입력필드 생성 및 관리 */
        function renderItemInputs(itemsArray) {
            const container = document.getElementById('itemInputsContainer');
            container.innerHTML = '';

            const list = (itemsArray && itemsArray.length > 0) ? itemsArray : [''];

            list.forEach((itemVal, index) => {
                addItemInputRow(itemVal, index === 0);
            });
        }

        function addItemInputRow(value = '', isFirst = false) {
            const container = document.getElementById('itemInputsContainer');
            const row = document.createElement('div');
            row.className = 'input-row item-input-row';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'item-input';
            input.placeholder = '제품명 입력';
            input.value = value;

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'btn-delete';
            deleteBtn.innerText = '삭제';
            deleteBtn.onclick = () => {
                const totalRows = container.querySelectorAll('.item-input-row').length;
                if (totalRows > 1) {
                    row.remove();
                } else {
                    input.value = '';
                }
            };

            row.appendChild(input);
            row.appendChild(deleteBtn);

            // 첫 번째 라인에만 + 버튼 추가
            if (isFirst) {
                const addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.className = 'btn-add';
                addBtn.innerText = '+';
                addBtn.title = '제품명 추가';
                addBtn.onclick = () => addItemInputRow('');
                row.appendChild(addBtn);
            }

            container.appendChild(row);
        }

        /* 파레트 번호 삭제 시 연동 동작 */
        function handlePalletDelete() {
            // 1. 파레트 번호 초기화
            document.getElementById('modalPallet').value = 'x';

            // 2. 제품명 목록 초기화 (첫 줄만 비우고 나머지 지움)
            renderItemInputs(['']);

            // 3. 상태를 '재고 없음 (x)'으로 변경
            document.getElementById('modalStatus').value = 'empty';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            currentEditingKey = null;
        }

        function saveModalData() {
            if (currentEditingKey) {
                const palletVal = document.getElementById('modalPallet').value.trim();
                const statusVal = document.getElementById('modalStatus').value;

                // 제품명 목록 추출
                const itemInputs = document.querySelectorAll('.item-input');
                const itemsList = [];
                itemInputs.forEach(input => {
                    const val = input.value.trim();
                    if (val) itemsList.push(val);
                });

                warehouseData[currentEditingKey].pallet = palletVal || 'x';
                warehouseData[currentEditingKey].items = itemsList;
                warehouseData[currentEditingKey].status = statusVal;
                
                renderWarehouse();
                closeModal();
            }
        }

        // 실행
        initData();
        renderWarehouse();
    </script>
</body>
</html>
